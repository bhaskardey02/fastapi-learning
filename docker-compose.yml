version: "3.9"

services:
  db:
    image: postgres:18
    container_name: postgres-db

    environment:
      POSTGRES_USER: bhaskar
      POSTGRES_PASSWORD: 2695183
      POSTGRES_DB: fastapi_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build: .

    container_name: fraud-api

    ports:
      - "8000:8000"

    depends_on:
      - db

volumes:
  postgres_data: